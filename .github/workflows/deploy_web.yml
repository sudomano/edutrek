name: Build & Deploy Flutter Web to cPanel

on:
  push:
    branches:
      - main   # or master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.edutrekholdings.co.zw
          username: edutrekholdings
          password: "Nqia&X9%FJKV"
          local-dir: build/web/
          server-dir: /home3/edutrekholdings/public_html/